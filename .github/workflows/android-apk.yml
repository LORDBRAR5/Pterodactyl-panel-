name: ORANGE Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools, platforms;android-36, build-tools;36.0.0, ndk;27.1.12297006'

      - name: Add Android build tools
        run: echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Align Expo native package versions
        run: npx expo install --fix

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Validate app config
        run: npx expo config --type public

      - name: Generate Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify APK architecture and signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          apksigner verify --verbose "$APK"
          unzip -l "$APK" | grep -q "lib/armeabi-v7a/"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/"
          aapt dump badging "$APK" | grep -q "sdkVersion:'24'"
          aapt dump badging "$APK" | grep -q "targetSdkVersion:'36'"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ORANGE-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14